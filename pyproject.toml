[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-regime-classifier"
version = "0.1.0"
description = "Point-in-time macro regime classification, transition forecasting, uncertainty analysis, and cross-asset mapping."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.31",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "scikit-learn>=1.4",
  "hmmlearn>=0.3.2",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "pandas-datareader>=0.10",
  "yfinance>=0.2.40",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
macro-regime = "macro_regime.engine:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
